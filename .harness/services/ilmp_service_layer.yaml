service:
  name: ilmp_service_layer
  identifier: ilmp_service_layer
  orgIdentifier: sandbox
  projectIdentifier: soto_sandbox
  description: SPDJI ILMP service layer (Spring Boot) on ECS Fargate. Dev, QA, QADR, UAT and Prod.
  tags:
    customer: spdji
    demo: ilmp
  serviceDefinition:
    type: ECS
    spec:
      artifacts:
        primary:
          primaryArtifactRef: ecr_svc
          sources:
            - identifier: ecr_svc
              type: Ecr
              spec:
                connectorRef: account.aws_oidc_iacm
                region: us-east-1
                imagePath: ilmp/service-layer
                tag: <+input>
                digest: <+input>
      manifests:
        - manifest:
            identifier: taskdef
            type: EcsTaskDefinition
            spec:
              store:
                type: Github
                spec:
                  connectorRef: ghalexsotoharnessfinegrained
                  repoName: ilmp-service-layer
                  gitFetchType: Branch
                  branch: main
                  paths:
                    - deploy/ecs/task-definition.yaml
        - manifest:
            identifier: svcdef
            type: EcsServiceDefinition
            spec:
              store:
                type: Github
                spec:
                  connectorRef: ghalexsotoharnessfinegrained
                  repoName: ilmp-service-layer
                  gitFetchType: Branch
                  branch: main
                  paths:
                    - 'deploy/ecs/<+<+env.identifier> == "ilmp_qadr" || <+env.identifier> == "ilmp_prod" ? "service-definition-bluegreen.yaml" : "service-definition.yaml">'
      variables:
        - name: COMPONENT
          type: String
          value: service-layer
        - name: VERSION_PATH
          type: String
          value: /api/version
        - name: BASE_URL
          type: String
          value: <+env.variables.base_url_svc>
        - name: SMOKE_SCRIPT
          type: String
          value: smoke-service-layer.sh
        - name: EXPECTED_DIGEST
          type: String
          value: <+input>
        - name: BG_QADR_PROD_LISTENER_ARN
          type: String
          value: arn:aws:elasticloadbalancing:us-east-1:759984737373:listener/app/ilmp-demo-alb/f3c915c2d376d66b/b2600cbbe57ffc5c
        - name: BG_QADR_PROD_RULE_ARN
          type: String
          value: arn:aws:elasticloadbalancing:us-east-1:759984737373:listener-rule/app/ilmp-demo-alb/f3c915c2d376d66b/b2600cbbe57ffc5c/bba9933c399b2ac7
        - name: BG_QADR_STAGE_LISTENER_ARN
          type: String
          value: arn:aws:elasticloadbalancing:us-east-1:759984737373:listener/app/ilmp-demo-alb/f3c915c2d376d66b/98a48cc1a359af66
        - name: BG_QADR_STAGE_RULE_ARN
          type: String
          value: arn:aws:elasticloadbalancing:us-east-1:759984737373:listener-rule/app/ilmp-demo-alb/f3c915c2d376d66b/98a48cc1a359af66/ad555d98431f1b2c
        - name: BG_PROD_PROD_LISTENER_ARN
          type: String
          value: arn:aws:elasticloadbalancing:us-east-1:759984737373:listener/app/ilmp-demo-alb/f3c915c2d376d66b/b7bad6741aa93220
        - name: BG_PROD_PROD_RULE_ARN
          type: String
          value: arn:aws:elasticloadbalancing:us-east-1:759984737373:listener-rule/app/ilmp-demo-alb/f3c915c2d376d66b/b7bad6741aa93220/8121a4ec08410816
        - name: BG_PROD_STAGE_LISTENER_ARN
