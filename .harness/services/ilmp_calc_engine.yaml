service:
  name: ilmp_calc_engine
  identifier: ilmp_calc_engine
  orgIdentifier: sandbox
  projectIdentifier: soto_sandbox
  description: SPDJI ILMP calc engine (Python FastAPI) on ECS Fargate. Artifact
    from ECR (same digest as HAR). Per-service deploy settings live in service
    variables so one multi-service pipeline stage can deploy both components.
  tags:
    customer: spdji
    demo: ilmp
  serviceDefinition:
    type: ECS
    spec:
      artifacts:
        primary:
          primaryArtifactRef: ecr_calc
          sources:
            - identifier: ecr_calc
              type: Ecr
              spec:
                connectorRef: account.aws_oidc_iacm
                region: us-east-1
                imagePath: ilmp/calc-engine
                tag: <+input>
                digest: <+input>
      manifests:
        - manifest:
            identifier: taskdef
            type: EcsTaskDefinition
            spec:
              store:
                type: Github
                spec:
                  connectorRef: ghalexsotoharnessfinegrained
                  repoName: ilmp-calc-engine
                  gitFetchType: Branch
                  branch: main
                  paths:
                    - deploy/ecs/task-definition.yaml
        - manifest:
            identifier: svcdef
            type: EcsServiceDefinition
            spec:
              store:
                type: Github
                spec:
                  connectorRef: ghalexsotoharnessfinegrained
                  repoName: ilmp-calc-engine
                  gitFetchType: Branch
                  branch: main
                  paths:
                    - 'deploy/ecs/<+<+env.identifier> == "ilmp_qadr" || <+env.identifier> == "ilmp_prod" ? "service-definition-bluegreen.yaml" : "service-definition.yaml">'
      variables:
        - name: COMPONENT
          type: String
          value: calc-engine
        - name: VERSION_PATH
          type: String
          value: /version
        - name: BASE_URL
          type: String
          value: <+env.variables.base_url_calc>
        - name: SMOKE_SCRIPT
          type: String
          value: smoke-backtest.sh
        - name: EXPECTED_DIGEST
          type: String
          value: <+input>
        - name: BG_QADR_PROD_LISTENER_ARN
          type: String
          value: arn:aws:elasticloadbalancing:us-east-1:759984737373:listener/app/ilmp-demo-alb/f3c915c2d376d66b/c68b799777e3c55e
        - name: BG_QADR_PROD_RULE_ARN
          type: String
          value: arn:aws:elasticloadbalancing:us-east-1:759984737373:listener-rule/app/ilmp-demo-alb/f3c915c2d376d66b/c68b799777e3c55e/d1254b2f2370ce28
        - name: BG_QADR_STAGE_LISTENER_ARN
          type: String
          value: arn:aws:elasticloadbalancing:us-east-1:759984737373:listener/app/ilmp-demo-alb/f3c915c2d376d66b/c41a47c9c1a394f7
        - name: BG_QADR_STAGE_RULE_ARN
          type: String
          value: arn:aws:elasticloadbalancing:us-east-1:759984737373:listener-rule/app/ilmp-demo-alb/f3c915c2d376d66b/c41a47c9c1a394f7/63b4976dfb698946
        - name: BG_PROD_PROD_LISTENER_ARN
          type: String
          value: arn:aws:elasticloadbalancing:us-east-1:759984737373:listener/app/ilmp-demo-alb/f3c915c2d376d66b/b9d54234f6e0be8e
        - name: BG_PROD_PROD_RULE_ARN
          type: String
          value: arn:aws:elasticloadbalancing:us-east-1:759984737373:listener-rule/app/ilmp-demo-alb/f3c915c2d376d66b/b9d54234f6e0be8e/7d6049da2f10c964
        - name: BG_PROD_STAGE_LISTENER_ARN
