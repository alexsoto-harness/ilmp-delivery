pipeline:
  name: ILMP Build
  identifier: ilmp_build
  projectIdentifier: soto_sandbox
  orgIdentifier: sandbox
  description: Build either component once, scan it, run the Eval gate, record the digest in releases/<release>.yaml, then hand the release to ILMP Deploy.
  tags:
    customer: spdji
    demo: ilmp
  properties:
    ci:
      codebase:
        connectorRef: ghalexsotoharnessfinegrained
        repoName: ilmp-<+pipeline.variables.component>
        build: <+input>
  variables:
    - name: component
      type: String
      value: <+input>.allowedValues(calc-engine,service-layer)
    - name: release
      type: String
      value: <+input>
    - name: change_type
      type: String
      value: <+input>.default(standard).allowedValues(standard,emergency)
    - name: deploy
      type: String
      value: <+input>.default(true).allowedValues(true,false)
  stages:
    - stage:
        name: Build
        identifier: build
        template:
          templateRef: ilmp_build_scan_push
          versionLabel: v1
    - stage:
        name: Release Gate
        identifier: release_gate
        type: CI
        spec:
          cloneCodebase: true
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - stepGroup:
                  name: gate
                  identifier: gate
                  template:
                    templateRef: ilmp_release_gate
                    versionLabel: v1
              - step:
                  type: Run
                  name: Record release
                  identifier: record_release
                  timeout: 5m
                  spec:
                    shell: Bash
                    envVariables:
                      GIT_PUSH_TOKEN: <+secrets.getValue("alexsoto-harness_Github_PAT")>
                    command: |-
                      set -euo pipefail
                      rm -rf /tmp/ilmp-delivery
                      git clone -q "https://x-access-token:${GIT_PUSH_TOKEN}@github.com/alexsoto-harness/ilmp-delivery.git" /tmp/ilmp-delivery
                      cd /tmp/ilmp-delivery
                      pushed=no
                      for attempt in 1 2 3 4 5; do
                        python3 scripts/record_release.py \
                          --file "releases/<+pipeline.variables.release>.yaml" \
                          --release "<+pipeline.variables.release>" \
                          --component "<+pipeline.variables.component>" \
                          --image "759984737373.dkr.ecr.us-east-1.amazonaws.com/ilmp/<+pipeline.variables.component>" \
                          --tag "<+pipeline.stages.build.spec.execution.steps.export_image.output.outputVariables.IMAGE_TAG>" \
                          --digest "<+pipeline.stages.build.spec.execution.steps.export_image.output.outputVariables.IMAGE_DIGEST>" \
                          --commit "<+codebase.commitSha>" \
                          --build-url "<+pipeline.executionUrl>" \
                          --eval-verdict "<+execution.steps.gate.steps.eval_gate.output.outputVariables.EVAL_VERDICT>" \
                          --eval-score "<+execution.steps.gate.steps.eval_gate.output.outputVariables.EVAL_SCORE>" | tee /tmp/record.out
                        git add releases
                        git -c user.name="Harness ILMP Build" -c user.email="ilmp-build@harness.io" commit -q -m "release <+pipeline.variables.release>: record <+pipeline.variables.component> <+pipeline.stages.build.spec.execution.steps.export_image.output.outputVariables.IMAGE_TAG>"
                        if git push -q origin HEAD:main; then pushed=yes; break; fi
                        git fetch -q origin main
                        git reset -q --hard origin/main
                      done
                      [ "$pushed" = yes ] || { echo "could not push the release manifest"; exit 1; }
                      echo "RELEASE_COMPLETE=$(sed -n 's/^RELEASE_COMPLETE=//p' /tmp/record.out | tail -1)" >> $HARNESS_OUTPUTS_PATH
                    outputVariables:
                      - name: RELEASE_COMPLETE
                        type: String
                        value: RELEASE_COMPLETE
        failureStrategies:
          - onFailure:
              errors: [AllErrors]
              action:
                type: MarkAsFailure
    - stage:
        name: Deploy
        identifier: deploy
        description: Promote the release through every environment once both components have a recorded build.
        type: Pipeline
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.deploy> == "true" && <+pipeline.stages.release_gate.spec.execution.steps.record_release.output.outputVariables.RELEASE_COMPLETE> == "true"
        spec:
          org: sandbox
          pipeline: ilmp_deploy
          project: soto_sandbox
          outputs: []
          inputs:
            identifier: ilmp_deploy
            variables:
              - name: release
                type: String
                value: <+pipeline.variables.release>
              - name: change_type
                type: String
                value: <+pipeline.variables.change_type>
