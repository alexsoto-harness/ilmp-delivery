pipeline:
  name: ILMP Release calc-engine
  identifier: ilmp_release_calc_engine
  projectIdentifier: soto_sandbox
  orgIdentifier: sandbox
  description: Build once, Eval gate, promote calc-engine Dev→QA→QADR→UAT→Approval→Prod 10/50/100.
  tags:
    customer: spdji
    demo: ilmp
  properties:
    ci:
      codebase:
        connectorRef: ghalexsotoharnessfinegrained
        repoName: ilmp-calc-engine
        build: <+input>
  variables:
    - name: component
      type: String
      value: calc-engine
    - name: change_type
      type: String
      value: <+input>.default(standard).allowedValues(standard,emergency)
    - name: IMAGE_TAG
      type: String
      value: ""
    - name: IMAGE_DIGEST
      type: String
      value: ""
  stages:
    - stage:
        name: Build
        identifier: build
        template:
          templateRef: ilmp_build_scan_push
          versionLabel: v1
    - stage:
        name: Release Gate
        identifier: release_gate
        type: CI
        spec:
          cloneCodebase: false
          platform:
            os: Linux
            arch: Amd64
          runtime:
            type: Cloud
            spec: {}
          execution:
            steps:
              - stepGroup:
                  name: gate
                  identifier: gate
                  template:
                    templateRef: ilmp_release_gate
                    versionLabel: v1
        failureStrategies:
          - onFailure:
              errors: [AllErrors]
              action:
                type: MarkAsFailure
    - stage:
        name: Dev
        identifier: dev
        type: Deployment
        spec:
          deploymentType: ECS
          service:
            serviceRef: ilmp_calc_engine
            serviceInputs:
              serviceDefinition:
                type: ECS
                spec:
                  artifacts:
                    primary:
                      primaryArtifactRef: ecr_calc
                      sources:
                        - identifier: ecr_calc
                          type: Ecr
                          spec:
                            tag: <+pipeline.variables.IMAGE_TAG>
                            digest: <+pipeline.variables.IMAGE_DIGEST>
          environment:
            environmentRef: ilmp_dev
            deployToAll: false
            infrastructureDefinitions:
              - identifier: ilmp_dev_ecs
          execution:
            steps:
              - step:
                  type: EcsRollingDeploy
                  name: Deploy
                  identifier: deploy
                  timeout: 15m
                  spec:
                    sameAsAlreadyRunningInstances: false
                    forceNewDeployment: false
              - step:
                  type: ShellScript
                  name: verify_version
                  identifier: verify_version
                  timeout: 5m
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: set -e; git clone --depth 1 https://github.com/alexsoto-harness/ilmp-delivery.git /tmp/d; /tmp/d/scripts/verify-version.sh "<+env.variables.base_url_calc>/version" "<+pipeline.variables.IMAGE_DIGEST>"
              - step:
                  type: ShellScript
                  name: smoke 3-day
                  identifier: smoke
                  timeout: 5m
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: set -e; git clone --depth 1 https://github.com/alexsoto-harness/ilmp-delivery.git /tmp/d; /tmp/d/scripts/smoke-backtest.sh "<+env.variables.base_url_calc>" 3
            rollbackSteps:
              - step:
                  type: EcsRollingRollback
                  name: Rollback
                  identifier: rollback
                  timeout: 15m
                  spec: {}
        failureStrategies:
          - onFailure:
              errors: [AllErrors]
              action:
                type: StageRollback
    - stage:
        name: QA Approval
        identifier: qa_approval
        type: Approval
        spec:
          execution:
            steps:
              - step:
                  type: HarnessApproval
                  name: QA Approval
                  identifier: qa_approval_step
                  timeout: 1d
                  spec:
                    approvalMessage: Approve calc-engine for QA
                    includePipelineExecutionHistory: true
                    approvers:
                      userGroups: [account._account_all_users]
                      minimumCount: 1
                      disallowPipelineExecutor: false
                    isAutoRejectEnabled: false
    - stage:
        name: QA
        identifier: qa
        type: Deployment
        spec:
          deploymentType: ECS
          service:
            serviceRef: ilmp_calc_engine
            serviceInputs:
              serviceDefinition:
                type: ECS
                spec:
                  artifacts:
                    primary:
                      primaryArtifactRef: ecr_calc
                      sources:
                        - identifier: ecr_calc
                          type: Ecr
                          spec:
                            tag: <+pipeline.variables.IMAGE_TAG>
                            digest: <+pipeline.variables.IMAGE_DIGEST>
          environment:
            environmentRef: ilmp_qa
            deployToAll: false
            infrastructureDefinitions:
              - identifier: ilmp_qa_ecs
          execution:
            steps:
              - step:
                  type: EcsRollingDeploy
                  name: Deploy
                  identifier: deploy
                  timeout: 15m
                  spec:
                    sameAsAlreadyRunningInstances: false
                    forceNewDeployment: false
              - step:
                  type: ShellScript
                  name: verify_version
                  identifier: verify_version
                  timeout: 5m
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: set -e; git clone --depth 1 https://github.com/alexsoto-harness/ilmp-delivery.git /tmp/d; /tmp/d/scripts/verify-version.sh "<+env.variables.base_url_calc>/version" "<+pipeline.variables.IMAGE_DIGEST>"
              - step:
                  type: ShellScript
                  name: smoke 3-day
                  identifier: smoke
                  timeout: 5m
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: set -e; git clone --depth 1 https://github.com/alexsoto-harness/ilmp-delivery.git /tmp/d; /tmp/d/scripts/smoke-backtest.sh "<+env.variables.base_url_calc>" 3
            rollbackSteps:
              - step:
                  type: EcsRollingRollback
                  name: Rollback
                  identifier: rollback
                  timeout: 15m
                  spec: {}
        failureStrategies:
          - onFailure:
              errors: [AllErrors]
              action:
                type: StageRollback
    - stage:
        name: QADR
        identifier: qadr
        type: Deployment
        spec:
          deploymentType: ECS
          service:
            serviceRef: ilmp_calc_engine
            serviceInputs:
              serviceDefinition:
                type: ECS
                spec:
                  artifacts:
                    primary:
                      primaryArtifactRef: ecr_calc
                      sources:
                        - identifier: ecr_calc
                          type: Ecr
                          spec:
                            tag: <+pipeline.variables.IMAGE_TAG>
                            digest: <+pipeline.variables.IMAGE_DIGEST>
          environment:
            environmentRef: ilmp_qadr
            deployToAll: false
            infrastructureDefinitions:
              - identifier: ilmp_qadr_ecs
          execution:
            steps:
              - step:
                  type: EcsBlueGreenCreateService
                  name: BG create
                  identifier: bg_create
                  timeout: 15m
                  spec:
                    loadBalancer: <+env.variables.alb_arn>
                    prodListener: <+env.variables.bg_prod_listener_arn>
                    prodListenerRuleArn: <+env.variables.bg_prod_rule_arn>
                    stageListener: <+env.variables.bg_stage_listener_arn>
                    stageListenerRuleArn: <+env.variables.bg_stage_rule_arn>
                    sameAsAlreadyRunningInstances: false
              - step:
                  type: ShellScript
                  name: verify_version
                  identifier: verify_version
                  timeout: 5m
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: set -e; git clone --depth 1 https://github.com/alexsoto-harness/ilmp-delivery.git /tmp/d; /tmp/d/scripts/verify-version.sh "<+env.variables.base_url_calc>/version" "<+pipeline.variables.IMAGE_DIGEST>"
              - step:
                  type: EcsBlueGreenSwapTargetGroups
                  name: BG swap
                  identifier: bg_swap
                  timeout: 15m
                  spec:
                    doNotDownOldService: false
              - step:
                  type: ShellScript
                  name: smoke 3-day
                  identifier: smoke
                  timeout: 5m
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: set -e; git clone --depth 1 https://github.com/alexsoto-harness/ilmp-delivery.git /tmp/d; /tmp/d/scripts/smoke-backtest.sh "<+env.variables.base_url_calc>" 3
            rollbackSteps:
              - step:
                  type: EcsBlueGreenRollback
                  name: BG rollback
                  identifier: bg_rollback
                  timeout: 15m
                  spec: {}
        failureStrategies:
          - onFailure:
              errors: [AllErrors]
              action:
                type: StageRollback
    - stage:
        name: UAT Approval
        identifier: uat_approval
        type: Approval
        spec:
          execution:
            steps:
              - step:
                  type: HarnessApproval
                  name: UAT Approval
                  identifier: uat_approval_step
                  timeout: 1d
                  spec:
                    approvalMessage: Approve calc-engine for UAT
                    includePipelineExecutionHistory: true
                    approvers:
                      userGroups: [account._account_all_users]
                      minimumCount: 1
                      disallowPipelineExecutor: false
                    isAutoRejectEnabled: false
    - stage:
        name: UAT
        identifier: uat
        type: Deployment
        spec:
          deploymentType: ECS
          service:
            serviceRef: ilmp_calc_engine
            serviceInputs:
              serviceDefinition:
                type: ECS
                spec:
                  artifacts:
                    primary:
                      primaryArtifactRef: ecr_calc
                      sources:
                        - identifier: ecr_calc
                          type: Ecr
                          spec:
                            tag: <+pipeline.variables.IMAGE_TAG>
                            digest: <+pipeline.variables.IMAGE_DIGEST>
          environment:
            environmentRef: ilmp_uat
            deployToAll: false
            infrastructureDefinitions:
              - identifier: ilmp_uat_ecs
          execution:
            steps:
              - step:
                  type: EcsRollingDeploy
                  name: Deploy
                  identifier: deploy
                  timeout: 15m
                  spec:
                    sameAsAlreadyRunningInstances: false
                    forceNewDeployment: false
              - step:
                  type: ShellScript
                  name: verify_version
                  identifier: verify_version
                  timeout: 5m
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: set -e; git clone --depth 1 https://github.com/alexsoto-harness/ilmp-delivery.git /tmp/d; /tmp/d/scripts/verify-version.sh "<+env.variables.base_url_calc>/version" "<+pipeline.variables.IMAGE_DIGEST>"
              - step:
                  type: ShellScript
                  name: smoke 3-day
                  identifier: smoke
                  timeout: 5m
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: set -e; git clone --depth 1 https://github.com/alexsoto-harness/ilmp-delivery.git /tmp/d; /tmp/d/scripts/smoke-backtest.sh "<+env.variables.base_url_calc>" 3
            rollbackSteps:
              - step:
                  type: EcsRollingRollback
                  name: Rollback
                  identifier: rollback
                  timeout: 15m
                  spec: {}
        failureStrategies:
          - onFailure:
              errors: [AllErrors]
              action:
                type: StageRollback
    - stage:
        name: Prod Approval
        identifier: prod_approval
        type: Approval
        spec:
          execution:
            steps:
              - step:
                  type: HarnessApproval
                  name: Prod Approval
                  identifier: prod_approval_step
                  timeout: 1d
                  spec:
                    approvalMessage: Approve Prod release (ServiceNow deferred)
                    includePipelineExecutionHistory: true
                    approvers:
                      userGroups: [account._account_all_users]
                      minimumCount: 1
                      disallowPipelineExecutor: false
                    isAutoRejectEnabled: false
    - stage:
        name: Prod
        identifier: prod
        type: Deployment
        spec:
          deploymentType: ECS
          service:
            serviceRef: ilmp_calc_engine
            serviceInputs:
              serviceDefinition:
                type: ECS
                spec:
                  artifacts:
                    primary:
                      primaryArtifactRef: ecr_calc
                      sources:
                        - identifier: ecr_calc
                          type: Ecr
                          spec:
                            tag: <+pipeline.variables.IMAGE_TAG>
                            digest: <+pipeline.variables.IMAGE_DIGEST>
          environment:
            environmentRef: ilmp_prod
            deployToAll: false
            infrastructureDefinitions:
              - identifier: ilmp_prod_ecs
          execution:
            steps:
              - step:
                  type: HarnessApproval
                  name: Pre-deploy change record
                  identifier: change_record
                  timeout: 1d
                  spec:
                    approvalMessage: Confirm change record for Prod
                    includePipelineExecutionHistory: true
                    approvers:
                      userGroups: [account._account_all_users]
                      minimumCount: 1
                      disallowPipelineExecutor: false
                    isAutoRejectEnabled: false
              - step:
                  type: EcsBlueGreenCreateService
                  name: BG create
                  identifier: bg_create
                  timeout: 15m
                  spec:
                    loadBalancer: <+env.variables.alb_arn>
                    prodListener: <+env.variables.bg_prod_listener_arn>
                    prodListenerRuleArn: <+env.variables.bg_prod_rule_arn>
                    stageListener: <+env.variables.bg_stage_listener_arn>
                    stageListenerRuleArn: <+env.variables.bg_stage_rule_arn>
                    sameAsAlreadyRunningInstances: false
                    isTrafficShift: true
              - step:
                  type: EcsBlueGreenTrafficShift
                  name: traffic 10
                  identifier: shift_10
                  timeout: 15m
                  spec:
                    ecsTrafficShiftWrapper:
                      type: Inherit
                      spec:
                        weightPercentage: 10
                        downsizeOldService: false
              - step:
                  type: EcsBlueGreenTrafficShift
                  name: traffic 50
                  identifier: shift_50
                  timeout: 15m
                  spec:
                    ecsTrafficShiftWrapper:
                      type: Inherit
                      spec:
                        weightPercentage: 50
                        downsizeOldService: false
              - step:
                  type: HarnessApproval
                  name: Support before 100
                  identifier: support_100
                  timeout: 1d
                  spec:
                    approvalMessage: Approve shift to 100%
                    includePipelineExecutionHistory: true
                    approvers:
                      userGroups: [account._account_all_users]
                      minimumCount: 1
                      disallowPipelineExecutor: false
                    isAutoRejectEnabled: false
              - step:
                  type: EcsBlueGreenTrafficShift
                  name: traffic 100
                  identifier: shift_100
                  timeout: 15m
                  spec:
                    ecsTrafficShiftWrapper:
                      type: Inherit
                      spec:
                        weightPercentage: 100
                        downsizeOldService: true
              - step:
                  type: ShellScript
                  name: verify_version
                  identifier: verify_version
                  timeout: 5m
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: set -e; git clone --depth 1 https://github.com/alexsoto-harness/ilmp-delivery.git /tmp/d; /tmp/d/scripts/verify-version.sh "<+env.variables.base_url_calc>/version" "<+pipeline.variables.IMAGE_DIGEST>"
              - step:
                  type: ShellScript
                  name: smoke 10-day
                  identifier: smoke
                  timeout: 10m
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: set -e; git clone --depth 1 https://github.com/alexsoto-harness/ilmp-delivery.git /tmp/d; /tmp/d/scripts/smoke-backtest.sh "<+env.variables.base_url_calc>" 10
            rollbackSteps:
              - step:
                  type: EcsBlueGreenRollback
                  name: BG rollback
                  identifier: bg_rollback
                  timeout: 15m
                  spec: {}
        failureStrategies:
          - onFailure:
              errors: [AllErrors]
              action:
                type: StageRollback
