pipeline:
  name: ILMP Deploy
  identifier: ilmp_deploy
  projectIdentifier: soto_sandbox
  orgIdentifier: sandbox
  description: Promote one release (calc-engine and service-layer together) through Dev, QA, QADR, UAT and Prod. Digests come from releases/<release>.yaml, written by ILMP Build.
  tags:
    customer: spdji
    demo: ilmp
  variables:
    - name: release
      type: String
      value: <+input>
    - name: change_type
      type: String
      value: <+input>.default(standard).allowedValues(standard,emergency)
  stages:
    - stage:
        name: Resolve Release
        identifier: resolve
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: read_release
                  identifier: read_release
                  timeout: 5m
                  spec:
                    shell: Bash
                    onDelegate: true
                    delegateSelectors:
                      - harness-eks-delegate-parson
                    source:
                      type: Inline
                      spec:
                        script: |-
                          set -e
                          rm -rf /tmp/ilmp-d && git clone -q --depth 1 https://github.com/alexsoto-harness/ilmp-delivery.git /tmp/ilmp-d
                          REL='<+pipeline.variables.release>'
                          eval "$(bash /tmp/ilmp-d/scripts/resolve-release.sh \"$REL\" /tmp/ilmp-d/releases)"
                          echo "calc-engine   $CALC_TAG $CALC_DIGEST build $CALC_BUILD"
                          echo "service-layer $SVC_TAG $SVC_DIGEST build $SVC_BUILD"
                    outputVariables:
                      - name: CALC_TAG
                        type: String
                        value: CALC_TAG
                      - name: CALC_DIGEST
                        type: String
                        value: CALC_DIGEST
                      - name: SVC_TAG
                        type: String
                        value: SVC_TAG
                      - name: SVC_DIGEST
                        type: String
                        value: SVC_DIGEST
