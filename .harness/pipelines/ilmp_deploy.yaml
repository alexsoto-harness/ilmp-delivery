pipeline:
  name: ILMP Deploy
  identifier: ilmp_deploy
  projectIdentifier: soto_sandbox
  orgIdentifier: sandbox
  description: Promote one release (calc-engine and service-layer together) through Dev, QA, QADR, UAT and Prod. Digests come from releases/<release>.yaml, written by ILMP Build.
  tags:
    customer: spdji
    demo: ilmp
  variables:
    - name: release
      type: String
      value: <+input>
    - name: change_type
      type: String
      value: <+input>.default(standard).allowedValues(standard,emergency)
  stages:
    - stage:
        name: Resolve Release
        identifier: resolve
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: read_release
                  identifier: read_release
                  timeout: 5m
                  spec:
                    shell: Bash
                    onDelegate: true
                    delegateSelectors:
                      - harness-eks-delegate-parson
                    source:
                      type: Inline
                      spec:
                        script: |-
                          set -e
                          rm -rf /tmp/ilmp-d && git clone -q --depth 1 https://github.com/alexsoto-harness/ilmp-delivery.git /tmp/ilmp-d
                          REL='<+pipeline.variables.release>'
                          eval "$(bash /tmp/ilmp-d/scripts/resolve-release.sh \"$REL\" /tmp/ilmp-d/releases)"
                          echo "calc-engine   $CALC_TAG $CALC_DIGEST build $CALC_BUILD"
                          echo "service-layer $SVC_TAG $SVC_DIGEST build $SVC_BUILD"
                    outputVariables:
                      - name: CALC_TAG
                        type: String
                        value: CALC_TAG
                      - name: CALC_DIGEST
                        type: String
                        value: CALC_DIGEST
                      - name: SVC_TAG
                        type: String
                        value: SVC_TAG
                      - name: SVC_DIGEST
                        type: String
                        value: SVC_DIGEST
    - stage:
        name: Dev
        identifier: dev
        type: Deployment
        spec:
          deploymentType: ECS
          services:
            values:
              - serviceRef: ilmp_calc_engine
                serviceInputs:
                  serviceDefinition:
                    type: ECS
                    spec:
                      artifacts:
                        primary:
                          primaryArtifactRef: ecr_calc
                          sources:
                            - identifier: ecr_calc
                              type: Ecr
                              spec:
                                tag: <+pipeline.stages.resolve.spec.execution.steps.read_release.output.outputVariables.CALC_TAG>
                                digest: <+pipeline.stages.resolve.spec.execution.steps.read_release.output.outputVariables.CALC_DIGEST>
                      variables:
                        - name: EXPECTED_DIGEST
                          type: String
                          value: <+pipeline.stages.resolve.spec.execution.steps.read_release.output.outputVariables.CALC_DIGEST>
              - serviceRef: ilmp_service_layer
                serviceInputs:
                  serviceDefinition:
                    type: ECS
                    spec:
                      artifacts:
                        primary:
                          primaryArtifactRef: ecr_svc
                          sources:
                            - identifier: ecr_svc
                              type: Ecr
                              spec:
                                tag: <+pipeline.stages.resolve.spec.execution.steps.read_release.output.outputVariables.SVC_TAG>
                                digest: <+pipeline.stages.resolve.spec.execution.steps.read_release.output.outputVariables.SVC_DIGEST>
                      variables:
                        - name: EXPECTED_DIGEST
                          type: String
                          value: <+pipeline.stages.resolve.spec.execution.steps.read_release.output.outputVariables.SVC_DIGEST>
            metadata:
              parallel: true
          environment:
            environmentRef: ilmp_dev
            deployToAll: false
            infrastructureDefinitions:
              - identifier: ilmp_dev_ecs
          execution:
            steps:
              - step:
                  type: EcsRollingDeploy
                  name: Deploy
                  identifier: deploy
                  timeout: 15m
                  spec:
                    sameAsAlreadyRunningInstances: false
                    forceNewDeployment: false
              - step:
                  type: ShellScript
                  name: verify_version
                  identifier: verify_version
                  timeout: 5m
                  spec:
                    shell: Bash
                    onDelegate: true
                    delegateSelectors:
                      - harness-eks-delegate-parson
                    source:
                      type: Inline
                      spec:
                        script: |-
                          set -e
                          D=/tmp/ilmp-<+pipeline.executionId>-<+stage.identifier>
                          rm -rf "$D" && git clone -q --depth 1 https://github.com/alexsoto-harness/ilmp-delivery.git "$D"
                          bash "$D/scripts/verify-version.sh" "<+serviceVariables.BASE_URL><+serviceVariables.VERSION_PATH>" "<+serviceVariables.EXPECTED_DIGEST>"
              - step:
                  type: ShellScript
                  name: smoke
                  identifier: smoke
                  timeout: 5m
                  spec:
                    shell: Bash
                    onDelegate: true
                    delegateSelectors:
                      - harness-eks-delegate-parson
                    source:
                      type: Inline
                      spec:
                        script: |-
                          set -e
                          D=/tmp/ilmp-<+pipeline.executionId>-<+stage.identifier>
                          bash "$D/scripts/<+serviceVariables.SMOKE_SCRIPT>" "<+serviceVariables.BASE_URL>" 3
            rollbackSteps:
              - step:
                  type: EcsRollingRollback
                  name: Rollback
                  identifier: rollback
                  timeout: 15m
                  spec: {}
        failureStrategies:
          - onFailure:
              errors: [AllErrors]
              action:
                type: StageRollback
    - stage:
        name: QA Approval
        identifier: qa_approval
        type: Approval
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.change_type> == "standard"
        spec:
          execution:
            steps:
              - step:
                  type: HarnessApproval
                  name: QA Approval
                  identifier: qa_approval_step
                  timeout: 1d
                  spec:
                    approvalMessage: |-
                      Approve release <+pipeline.variables.release> for QA and QADR.
                      calc-engine <+pipeline.stages.resolve.spec.execution.steps.read_release.output.outputVariables.CALC_TAG>
                      service-layer <+pipeline.stages.resolve.spec.execution.steps.read_release.output.outputVariables.SVC_TAG>
                    includePipelineExecutionHistory: true
                    approvers:
                      userGroups: [account._account_all_users]
                      minimumCount: 1
                      disallowPipelineExecutor: false
                    isAutoRejectEnabled: false
    - parallel:
        - stage:
            name: QA
            identifier: qa
            type: Deployment
            spec:
              deploymentType: ECS
              services:
                values:
                  - serviceRef: ilmp_calc_engine
                    serviceInputs:
                      serviceDefinition:
                        type: ECS
                        spec:
                          artifacts:
                            primary:
                              primaryArtifactRef: ecr_calc
                              sources:
                                - identifier: ecr_calc
                                  type: Ecr
                                  spec:
                                    tag: <+pipeline.stages.resolve.spec.execution.steps.read_release.output.outputVariables.CALC_TAG>
                                    digest: <+pipeline.stages.resolve.spec.execution.steps.read_release.output.outputVariables.CALC_DIGEST>
                          variables:
                            - name: EXPECTED_DIGEST
                              type: String
                              value: <+pipeline.stages.resolve.spec.execution.steps.read_release.output.outputVariables.CALC_DIGEST>
                  - serviceRef: ilmp_service_layer
                    serviceInputs:
                      serviceDefinition:
                        type: ECS
                        spec:
                          artifacts:
                            primary:
                              primaryArtifactRef: ecr_svc
                              sources:
                                - identifier: ecr_svc
                                  type: Ecr
                                  spec:
                                    tag: <+pipeline.stages.resolve.spec.execution.steps.read_release.output.outputVariables.SVC_TAG>
                                    digest: <+pipeline.stages.resolve.spec.execution.steps.read_release.output.outputVariables.SVC_DIGEST>
                          variables:
                            - name: EXPECTED_DIGEST
                              type: String
                              value: <+pipeline.stages.resolve.spec.execution.steps.read_release.output.outputVariables.SVC_DIGEST>
                metadata:
                  parallel: true
              environment:
                environmentRef: ilmp_qa
                deployToAll: false
                infrastructureDefinitions:
                  - identifier: ilmp_qa_ecs
              execution:
                steps:
                  - step:
                      type: EcsRollingDeploy
                      name: Deploy
                      identifier: deploy
                      timeout: 15m
                      spec:
                        sameAsAlreadyRunningInstances: false
                        forceNewDeployment: false
                  - step:
                      type: ShellScript
                      name: verify_version
                      identifier: verify_version
                      timeout: 5m
                      spec:
                        shell: Bash
                        onDelegate: true
                        delegateSelectors:
                          - harness-eks-delegate-parson
                        source:
                          type: Inline
                          spec:
                            script: |-
                              set -e
                              D=/tmp/ilmp-<+pipeline.executionId>-<+stage.identifier>
                              rm -rf "$D" && git clone -q --depth 1 https://github.com/alexsoto-harness/ilmp-delivery.git "$D"
                              bash "$D/scripts/verify-version.sh" "<+serviceVariables.BASE_URL><+serviceVariables.VERSION_PATH>" "<+serviceVariables.EXPECTED_DIGEST>"
                  - step:
                      type: ShellScript
                      name: smoke
                      identifier: smoke
                      timeout: 5m
                      spec:
                        shell: Bash
                        onDelegate: true
                        delegateSelectors:
                          - harness-eks-delegate-parson
                        source:
                          type: Inline
                          spec:
                            script: |-
                              set -e
                              D=/tmp/ilmp-<+pipeline.executionId>-<+stage.identifier>
                              bash "$D/scripts/<+serviceVariables.SMOKE_SCRIPT>" "<+serviceVariables.BASE_URL>" 3
                rollbackSteps:
                  - step:
                      type: EcsRollingRollback
                      name: Rollback
                      identifier: rollback
                      timeout: 15m
                      spec: {}
            failureStrategies:
              - onFailure:
                  errors: [AllErrors]
                  action:
                    type: StageRollback
        - stage:
            name: QADR
            identifier: qadr
            type: Deployment
            spec:
              deploymentType: ECS
              services:
                values:
                  - serviceRef: ilmp_calc_engine
                    serviceInputs:
                      serviceDefinition:
                        type: ECS
                        spec:
                          artifacts:
                            primary:
                              primaryArtifactRef: ecr_calc
                              sources:
                                - identifier: ecr_calc
                                  type: Ecr
                                  spec:
                                    tag: <+pipeline.stages.resolve.spec.execution.steps.read_release.output.outputVariables.CALC_TAG>
                                    digest: <+pipeline.stages.resolve.spec.execution.steps.read_release.output.outputVariables.CALC_DIGEST>
                          variables:
                            - name: EXPECTED_DIGEST
                              type: String
                              value: <+pipeline.stages.resolve.spec.execution.steps.read_release.output.outputVariables.CALC_DIGEST>
                  - serviceRef: ilmp_service_layer
                    serviceInputs:
                      serviceDefinition:
                        type: ECS
                        spec:
                          artifacts:
                            primary:
                              primaryArtifactRef: ecr_svc
                              sources:
                                - identifier: ecr_svc
                                  type: Ecr
                                  spec:
                                    tag: <+pipeline.stages.resolve.spec.execution.steps.read_release.output.outputVariables.SVC_TAG>
                                    digest: <+pipeline.stages.resolve.spec.execution.steps.read_release.output.outputVariables.SVC_DIGEST>
                          variables:
                            - name: EXPECTED_DIGEST
                              type: String
                              value: <+pipeline.stages.resolve.spec.execution.steps.read_release.output.outputVariables.SVC_DIGEST>
                metadata:
                  parallel: true
              environment:
                environmentRef: ilmp_qadr
                deployToAll: false
                infrastructureDefinitions:
                  - identifier: ilmp_qadr_ecs
              execution:
                steps:
                  - step:
                      type: EcsBlueGreenCreateService
                      name: BG create
                      identifier: bg_create
                      timeout: 15m
                      spec:
                        loadBalancer: <+env.variables.alb_arn>
                        prodListener: <+serviceVariables.BG_QADR_PROD_LISTENER_ARN>
                        prodListenerRuleArn: <+serviceVariables.BG_QADR_PROD_RULE_ARN>
                        stageListener: <+serviceVariables.BG_QADR_STAGE_LISTENER_ARN>
                        stageListenerRuleArn: <+serviceVariables.BG_QADR_STAGE_RULE_ARN>
                        sameAsAlreadyRunningInstances: false
                  - step:
                      type: EcsBlueGreenSwapTargetGroups
                      name: BG swap
                      identifier: bg_swap
                      timeout: 15m
                      spec:
                        doNotDownOldService: true
                  - step:
                      type: ShellScript
                      name: verify_version
                      identifier: verify_version
                      timeout: 5m
                      spec:
                        shell: Bash
                        onDelegate: true
                        delegateSelectors:
                          - harness-eks-delegate-parson
                        source:
                          type: Inline
                          spec:
                            script: |-
                              set -e
                              D=/tmp/ilmp-<+pipeline.executionId>-<+stage.identifier>
                              rm -rf "$D" && git clone -q --depth 1 https://github.com/alexsoto-harness/ilmp-delivery.git "$D"
                              bash "$D/scripts/verify-version.sh" "<+serviceVariables.BASE_URL><+serviceVariables.VERSION_PATH>" "<+serviceVariables.EXPECTED_DIGEST>"
                  - step:
                      type: ShellScript
                      name: smoke
                      identifier: smoke
                      timeout: 5m
                      spec:
                        shell: Bash
                        onDelegate: true
                        delegateSelectors:
                          - harness-eks-delegate-parson
                        source:
                          type: Inline
                          spec:
                            script: |-
                              set -e
                              D=/tmp/ilmp-<+pipeline.executionId>-<+stage.identifier>
                              bash "$D/scripts/<+serviceVariables.SMOKE_SCRIPT>" "<+serviceVariables.BASE_URL>" 3
                rollbackSteps:
                  - step:
                      type: EcsBlueGreenRollback
                      name: BG rollback
                      identifier: bg_rollback
                      timeout: 15m
                      spec: {}
            failureStrategies:
              - onFailure:
                  errors: [AllErrors]
                  action:
                    type: StageRollback
    - stage:
        name: UAT Approval
        identifier: uat_approval
        type: Approval
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.change_type> == "standard"
        spec:
          execution:
            steps:
              - step:
                  type: HarnessApproval
                  name: UAT Approval
                  identifier: uat_approval_step
                  timeout: 1d
                  spec:
                    approvalMessage: |-
                      Approve release <+pipeline.variables.release> for UAT.
                      calc-engine <+pipeline.stages.resolve.spec.execution.steps.read_release.output.outputVariables.CALC_TAG>
                      service-layer <+pipeline.stages.resolve.spec.execution.steps.read_release.output.outputVariables.SVC_TAG>
                    includePipelineExecutionHistory: true
                    approvers:
                      userGroups: [account._account_all_users]
                      minimumCount: 1
                      disallowPipelineExecutor: false
                    isAutoRejectEnabled: false
    - stage:
        name: UAT
        identifier: uat
        type: Deployment
        spec:
          deploymentType: ECS
          services:
            values:
              - serviceRef: ilmp_calc_engine
                serviceInputs:
                  serviceDefinition:
                    type: ECS
                    spec:
                      artifacts:
                        primary:
                          primaryArtifactRef: ecr_calc
                          sources:
                            - identifier: ecr_calc
                              type: Ecr
                              spec:
                                tag: <+pipeline.stages.resolve.spec.execution.steps.read_release.output.outputVariables.CALC_TAG>
                                digest: <+pipeline.stages.resolve.spec.execution.steps.read_release.output.outputVariables.CALC_DIGEST>
                      variables:
                        - name: EXPECTED_DIGEST
                          type: String
                          value: <+pipeline.stages.resolve.spec.execution.steps.read_release.output.outputVariables.CALC_DIGEST>
              - serviceRef: ilmp_service_layer
                serviceInputs:
                  serviceDefinition:
                    type: ECS
                    spec:
                      artifacts:
                        primary:
                          primaryArtifactRef: ecr_svc
                          sources:
                            - identifier: ecr_svc
                              type: Ecr
                              spec:
                                tag: <+pipeline.stages.resolve.spec.execution.steps.read_release.output.outputVariables.SVC_TAG>
                                digest: <+pipeline.stages.resolve.spec.execution.steps.read_release.output.outputVariables.SVC_DIGEST>
                      variables:
                        - name: EXPECTED_DIGEST
                          type: String
                          value: <+pipeline.stages.resolve.spec.execution.steps.read_release.output.outputVariables.SVC_DIGEST>
            metadata:
              parallel: true
          environment:
            environmentRef: ilmp_uat
            deployToAll: false
            infrastructureDefinitions:
              - identifier: ilmp_uat_ecs
          execution:
            steps:
              - step:
                  type: EcsRollingDeploy
                  name: Deploy
                  identifier: deploy
                  timeout: 15m
                  spec:
                    sameAsAlreadyRunningInstances: false
                    forceNewDeployment: false
              - step:
                  type: ShellScript
                  name: verify_version
                  identifier: verify_version
                  timeout: 5m
                  spec:
                    shell: Bash
                    onDelegate: true
                    delegateSelectors:
                      - harness-eks-delegate-parson
                    source:
                      type: Inline
                      spec:
                        script: |-
                          set -e
                          D=/tmp/ilmp-<+pipeline.executionId>-<+stage.identifier>
                          rm -rf "$D" && git clone -q --depth 1 https://github.com/alexsoto-harness/ilmp-delivery.git "$D"
                          bash "$D/scripts/verify-version.sh" "<+serviceVariables.BASE_URL><+serviceVariables.VERSION_PATH>" "<+serviceVariables.EXPECTED_DIGEST>"
              - step:
                  type: ShellScript
                  name: smoke
                  identifier: smoke
                  timeout: 5m
                  spec:
                    shell: Bash
                    onDelegate: true
                    delegateSelectors:
                      - harness-eks-delegate-parson
                    source:
                      type: Inline
                      spec:
                        script: |-
                          set -e
                          D=/tmp/ilmp-<+pipeline.executionId>-<+stage.identifier>
                          bash "$D/scripts/<+serviceVariables.SMOKE_SCRIPT>" "<+serviceVariables.BASE_URL>" 3
            rollbackSteps:
              - step:
                  type: EcsRollingRollback
                  name: Rollback
                  identifier: rollback
                  timeout: 15m
                  spec: {}
        failureStrategies:
          - onFailure:
              errors: [AllErrors]
              action:
                type: StageRollback
    - stage:
        name: Prod Approval
        identifier: prod_approval
        type: Approval
        spec:
          execution:
            steps:
              - step:
                  type: HarnessApproval
                  name: Prod Approval
                  identifier: prod_approval_step
                  timeout: 1d
                  spec:
                    approvalMessage: |-
                      Approve release <+pipeline.variables.release> for Prod (ServiceNow deferred).
                      calc-engine <+pipeline.stages.resolve.spec.execution.steps.read_release.output.outputVariables.CALC_TAG>
                      service-layer <+pipeline.stages.resolve.spec.execution.steps.read_release.output.outputVariables.SVC_TAG>
                    includePipelineExecutionHistory: true
                    approvers:
                      userGroups: [account._account_all_users]
                      minimumCount: 1
                      disallowPipelineExecutor: false
                    isAutoRejectEnabled: false
    - stage:
        name: Prod
        identifier: prod
        type: Deployment
        spec:
          deploymentType: ECS
          services:
            values:
              - serviceRef: ilmp_calc_engine
                serviceInputs:
                  serviceDefinition:
                    type: ECS
                    spec:
                      artifacts:
                        primary:
                          primaryArtifactRef: ecr_calc
                          sources:
                            - identifier: ecr_calc
                              type: Ecr
                              spec:
                                tag: <+pipeline.stages.resolve.spec.execution.steps.read_release.output.outputVariables.CALC_TAG>
                                digest: <+pipeline.stages.resolve.spec.execution.steps.read_release.output.outputVariables.CALC_DIGEST>
                      variables:
                        - name: EXPECTED_DIGEST
                          type: String
                          value: <+pipeline.stages.resolve.spec.execution.steps.read_release.output.outputVariables.CALC_DIGEST>
              - serviceRef: ilmp_service_layer
                serviceInputs:
                  serviceDefinition:
                    type: ECS
                    spec:
                      artifacts:
                        primary:
                          primaryArtifactRef: ecr_svc
                          sources:
                            - identifier: ecr_svc
                              type: Ecr
                              spec:
                                tag: <+pipeline.stages.resolve.spec.execution.steps.read_release.output.outputVariables.SVC_TAG>
                                digest: <+pipeline.stages.resolve.spec.execution.steps.read_release.output.outputVariables.SVC_DIGEST>
                      variables:
                        - name: EXPECTED_DIGEST
                          type: String
                          value: <+pipeline.stages.resolve.spec.execution.steps.read_release.output.outputVariables.SVC_DIGEST>
            metadata:
              parallel: true
          environment:
            environmentRef: ilmp_prod
            deployToAll: false
            infrastructureDefinitions:
              - identifier: ilmp_prod_ecs
          execution:
            steps:
              - step:
                  type: HarnessApproval
                  name: Pre-deploy change record
                  identifier: change_record
                  timeout: 1d
                  when:
                    stageStatus: Success
                    condition: <+serviceVariables.COMPONENT> == "calc-engine"
                  spec:
                    approvalMessage: Confirm the change record for this Prod release
                    includePipelineExecutionHistory: true
                    approvers:
                      userGroups: [account._account_all_users]
                      minimumCount: 1
                      disallowPipelineExecutor: false
                    isAutoRejectEnabled: false
              - step:
                  type: EcsBlueGreenCreateService
                  name: BG create
                  identifier: bg_create
                  timeout: 15m
                  spec:
                    loadBalancer: <+env.variables.alb_arn>
                    prodListener: <+serviceVariables.BG_PROD_PROD_LISTENER_ARN>
                    prodListenerRuleArn: <+serviceVariables.BG_PROD_PROD_RULE_ARN>
                    stageListener: <+serviceVariables.BG_PROD_STAGE_LISTENER_ARN>
                    stageListenerRuleArn: <+serviceVariables.BG_PROD_STAGE_RULE_ARN>
                    sameAsAlreadyRunningInstances: false
                    isTrafficShift: true
              - step:
                  type: EcsBlueGreenTrafficShift
                  name: traffic 10
                  identifier: shift_10
                  timeout: 15m
                  spec:
                    ecsTrafficShiftWrapper:
                      type: Inherit
                      spec:
                        weightPercentage: 10
                        downsizeOldService: false
              - step:
                  type: EcsBlueGreenTrafficShift
                  name: traffic 50
                  identifier: shift_50
                  timeout: 15m
                  spec:
                    ecsTrafficShiftWrapper:
                      type: Inherit
                      spec:
                        weightPercentage: 50
                        downsizeOldService: false
              - step:
                  type: HarnessApproval
                  name: Support before 100
                  identifier: support_100
                  timeout: 1d
                  when:
                    stageStatus: Success
                    condition: <+serviceVariables.COMPONENT> == "calc-engine"
                  spec:
                    approvalMessage: Approve the shift to 100%
                    includePipelineExecutionHistory: true
                    approvers:
                      userGroups: [account._account_all_users]
                      minimumCount: 1
                      disallowPipelineExecutor: false
                    isAutoRejectEnabled: false
              - step:
                  type: EcsBlueGreenTrafficShift
                  name: traffic 100
                  identifier: shift_100
                  timeout: 15m
                  spec:
                    ecsTrafficShiftWrapper:
                      type: Inherit
                      spec:
                        weightPercentage: 100
                        downsizeOldService: false
              - step:
                  type: ShellScript
                  name: verify_version
                  identifier: verify_version
                  timeout: 5m
                  spec:
                    shell: Bash
                    onDelegate: true
                    delegateSelectors:
                      - harness-eks-delegate-parson
                    source:
                      type: Inline
                      spec:
                        script: |-
                          set -e
                          D=/tmp/ilmp-<+pipeline.executionId>-<+stage.identifier>
                          rm -rf "$D" && git clone -q --depth 1 https://github.com/alexsoto-harness/ilmp-delivery.git "$D"
                          bash "$D/scripts/verify-version.sh" "<+serviceVariables.BASE_URL><+serviceVariables.VERSION_PATH>" "<+serviceVariables.EXPECTED_DIGEST>"
              - step:
                  type: ShellScript
                  name: smoke 10-day
                  identifier: smoke
                  timeout: 10m
                  spec:
                    shell: Bash
                    onDelegate: true
                    delegateSelectors:
                      - harness-eks-delegate-parson
                    source:
                      type: Inline
                      spec:
                        script: |-
                          set -e
                          D=/tmp/ilmp-<+pipeline.executionId>-<+stage.identifier>
                          bash "$D/scripts/<+serviceVariables.SMOKE_SCRIPT>" "<+serviceVariables.BASE_URL>" 10
            rollbackSteps:
              - step:
                  type: EcsBlueGreenRollback
                  name: BG rollback
                  identifier: bg_rollback
                  timeout: 15m
                  spec: {}
        failureStrategies:
          - onFailure:
              errors: [AllErrors]
              action:
                type: StageRollback
